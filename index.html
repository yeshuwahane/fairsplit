<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Epic • FairSplit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #0d2818 0%, #06100e 60%, #030706 100%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 28px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(16, 185, 129, 0.15);
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .icon-orb {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10B981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
    }
    .icon-orb svg { width: 36px; height: 36px; fill: #000000; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.subtitle { color: #94A3B8; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    .code-box {
      background: #0F172A;
      border: 1px dashed rgba(16, 185, 129, 0.5);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .code-value {
      font-family: monospace;
      font-size: 20px;
      font-weight: 800;
      color: #10B981;
      letter-spacing: 1.5px;
    }
    .copy-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10B981;
      color: #10B981;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover { background: #10B981; color: #000; }
    .btn-primary {
      display: block;
      width: 100%;
      background: #10B981;
      color: #000000;
      font-size: 15px;
      font-weight: 800;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 12px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      display: block;
      width: 100%;
      background: #334155;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
    }
    .copied-toast {
      color: #10B981;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">FairSplit Invite</div>
    <div class="icon-orb">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    </div>
    <h1>You're Invited!</h1>
    <p class="subtitle">Join this expense group on FairSplit to split bills, track balances, and settle up easily.</p>

    <div class="code-box">
      <span class="code-value" id="invite-code">FS-SPLIT</span>
      <button class="copy-btn" id="copy-btn" onclick="copyCode()">Copy</button>
    </div>
    <div class="copied-toast" id="copied-toast">✓ Code copied to clipboard!</div>

    <a href="#" id="open-app-link" class="btn-primary">Open in FairSplit App</a>
    <a href="https://github.com/yeshuwahane/fairsplit/releases/latest" class="btn-secondary">Download FairSplit APK</a>
  </div>

  <script>
    // Extract code from URL query parameters: ?code=FS-XYZ-1234
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || 'FS-SPLIT';
    document.getElementById('invite-code').innerText = code;

    const deepLink = `fairsplit://epic/join?code=${encodeURIComponent(code)}`;
    document.getElementById('open-app-link').href = deepLink;

    // Auto-attempt to trigger app launch on mobile
    if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
      setTimeout(() => {
        window.location.href = deepLink;
      }, 400);
    }

    function copyCode() {
      navigator.clipboard.writeText(code).then(() => {
        const toast = document.getElementById('copied-toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
      });
    }
  </script>
</body>
</html>
