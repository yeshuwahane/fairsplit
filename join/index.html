<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FairSplit • Fair, Fast & Frictionless Expense Splitting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 15%, #0d2818 0%, #081412 55%, #030706 100%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(22, 33, 49, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 28px;
      max-width: 440px;
      width: 100%;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 45px rgba(16, 185, 129, 0.12);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .icon-orb {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, #10B981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
    }
    .icon-orb svg { width: 38px; height: 38px; fill: #042114; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.5px; }
    p.subtitle { color: #94A3B8; font-size: 14px; line-height: 1.55; margin-bottom: 24px; }
    .code-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px dashed rgba(16, 185, 129, 0.45);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .code-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: #10B981;
      letter-spacing: 1px;
    }
    .copy-btn {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #10B981;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover { background: #10B981; color: #03140c; }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #10B981;
      color: #03140c;
      font-size: 15px;
      font-weight: 800;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: rgba(51, 65, 85, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #F1F5F9;
      font-size: 14px;
      font-weight: 700;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: rgba(51, 65, 85, 0.9); }
    .copied-toast {
      color: #10B981;
      font-size: 12px;
      font-weight: 600;
      margin-top: -10px;
      margin-bottom: 16px;
      display: none;
    }
    .platform-hint {
      margin-top: 18px;
      font-size: 12px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="badge-label">✨ FairSplit Group Invite</div>
    <div class="icon-orb">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    </div>
    <h1 id="title">You're Invited!</h1>
    <p class="subtitle" id="subtitle">Join this group on FairSplit to split expenses, track balances in real-time, and settle up with zero friction.</p>

    <div class="code-box" id="code-container">
      <span class="code-value" id="invite-code">FS-SPLIT</span>
      <button class="copy-btn" id="copy-btn" onclick="copyCode()">Copy Code</button>
    </div>
    <div class="copied-toast" id="copied-toast">✓ Code copied to clipboard!</div>

    <a href="#" id="open-app-link" class="btn-primary">
      <span>🚀 Open in FairSplit App</span>
    </a>
    <a href="https://github.com/yeshuwahane/fairsplit/releases/latest" id="download-link" class="btn-secondary">
      <span>📥 Download Android APK</span>
    </a>

    <div class="platform-hint">Works seamlessly on Android & iOS</div>
  </div>

  <script>
    // Extract code from URL search query: ?code=FS-XYZ
    const urlParams = new URLSearchParams(window.location.search);
    let code = urlParams.get('code');

    // Also check pathname in case of /join/FS-XYZ
    if (!code) {
      const match = window.location.pathname.match(/\/join\/([^/?]+)/);
      if (match && match[1]) {
        code = match[1];
      }
    }

    const openAppLink = document.getElementById('open-app-link');
    const inviteCodeEl = document.getElementById('invite-code');
    const codeContainer = document.getElementById('code-container');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const badgeEl = document.getElementById('badge-label');

    if (code && code.trim().length > 0) {
      code = code.trim().toUpperCase();
      inviteCodeEl.innerText = code;
      const deepLink = `fairsplit://epic/join?code=${encodeURIComponent(code)}`;
      openAppLink.href = deepLink;

      // Auto-trigger deep link on mobile devices
      if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
        setTimeout(() => {
          window.location.href = deepLink;
        }, 350);
      }
    } else {
      // General landing page mode
      badgeEl.innerText = '⚡ Kotlin Multiplatform';
      titleEl.innerText = 'Welcome to FairSplit';
      subtitleEl.innerText = 'Fair, fast, and frictionless group expense splitting for Android & iOS.';
      codeContainer.style.display = 'none';
      openAppLink.href = 'fairsplit://';
      openAppLink.innerText = '🚀 Launch FairSplit App';
    }

    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        const toast = document.getElementById('copied-toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2200);
      }).catch(() => {
        // Fallback
        const temp = document.createElement("input");
        document.body.appendChild(temp);
        temp.value = code;
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        const toast = document.getElementById('copied-toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2200);
      });
    }
  </script>
</body>
</html>
